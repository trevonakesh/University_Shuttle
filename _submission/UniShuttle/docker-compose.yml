version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lankatrip-postgres
    restart: always
    environment:
      POSTGRES_USER: lankatrip_user
      POSTGRES_PASSWORD: lankatrip_password
      POSTGRES_DB: lankatrip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
